<!doctype html>
<html lang="ru">
<head>
  <!-- @@ head -->
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Статистика контента</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* @@ palette */
    :root {
      --bg-a: #cfc1b5;
      --bg-b: #b9a799;
      --bg-c: #a08b7c;
      --ink: #2b231e;
      --ink-2: #5a4c43;
      --muted: #7d6d62;
      --glass: rgba(255, 250, 245, 0.42);
      --glass-strong: rgba(255, 250, 245, 0.6);
      --glass-border: rgba(255, 255, 255, 0.55);
      --dark: #2a221d;
      --dark-2: #3a302a;
      --pink: #e98aa5;
      --pink-deep: #c9466e;
      --sage: #b7c4b2;
      --sky: #aebfd9;
      --clay: #e3a98f;
      --mauve: #b9a493;
      --shadow: 0 18px 40px -18px rgba(60, 42, 30, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      --radius-xl: 28px;
      --radius-l: 22px;
      --radius-m: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg-a);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* @@ backdrop */
    /* Мягкий фон с размытыми пятнами, как на референсах */
    .backdrop {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background: linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
    }
    .backdrop::before, .backdrop::after {
      content: ""; position: absolute; border-radius: 50%; filter: blur(60px); opacity: .85;
    }
    .backdrop::before {
      width: 70vw; height: 70vw; top: -20vw; right: -25vw;
      background: radial-gradient(circle, #e8d6c4 0%, rgba(232, 214, 196, 0) 70%);
    }
    .backdrop::after {
      width: 80vw; height: 80vw; bottom: -30vw; left: -30vw;
      background: radial-gradient(circle, #8c7466 0%, rgba(140, 116, 102, 0) 70%);
    }
    .orb {
      position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 35% 30%, #ffe3ea 0%, #f4b9c8 45%, #e6a0b5 100%);
      box-shadow: 0 30px 60px -20px rgba(201, 70, 110, 0.45), inset -10px -14px 30px rgba(255,255,255,.5);
      width: 150px; height: 150px; right: -40px; top: 34vh; opacity: .55; filter: blur(1px);
    }

    .app { max-width: 520px; margin: 0 auto; padding: calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 28px); }

    /* @@ header */
    /* Шапка */
    .top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .title { font-size: 34px; font-weight: 300; letter-spacing: -0.5px; line-height: 1.05; margin: 0; }
    .title b { font-weight: 600; }
    .subtitle { margin: 8px 0 0; font-size: 13px; color: var(--muted); letter-spacing: .2px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-border);
      background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); color: var(--ink);
      flex: none;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* @@ hero */
    /* Карточка «Летит сейчас» */
    .hero {
      position: relative; overflow: hidden;
      border-radius: var(--radius-xl); padding: 18px 18px 16px; margin-bottom: 16px;
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 100%);
      color: #fff; box-shadow: 0 24px 50px -22px rgba(33, 29, 30, 0.6);
      cursor: pointer;
    }
    .hero::after {
      content: ""; position: absolute; width: 220px; height: 220px; right: -70px; bottom: -120px; border-radius: 50%;
      background: radial-gradient(circle, rgba(233,138,165,.55) 0%, rgba(233,138,165,0) 70%);
    }
    .hero-label { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(255,255,255,.65); }
    .hero-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 4px rgba(233,138,165,.3); }
    .hero-body { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
    .hero-thumb { width: 64px; height: 84px; border-radius: 18px; flex: none; overflow: hidden; background: #3a3335; }
    .hero-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-title { font-size: 17px; font-weight: 500; line-height: 1.25; margin: 0 0 6px; }
    .hero-meta { font-size: 12px; color: rgba(255,255,255,.6); }
    .hero-num { margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hero-num strong { font-size: 34px; font-weight: 300; letter-spacing: -1px; white-space: nowrap; line-height: 1; }
    .hero-num .hero-sub { font-size: 12px; color: rgba(255,255,255,.6); width: 100%; margin-top: 2px; }
    .hero-pct { margin-left: auto; padding: 6px 12px; border-radius: 999px; background: var(--pink-deep); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* @@ chips-seg */
    /* Переключатели */
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; padding: 10px 16px; border-radius: 999px; font-size: 14px; color: var(--ink-2);
      border: 1px solid var(--glass-border); background: var(--glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all .18s ease;
      box-shadow: 0 10px 24px -16px rgba(90,60,66,.35);
    }
    .chip .pf { width: 18px; height: 18px; border-radius: 5px; }
    .chip.active { background: var(--dark); color: #fff; border-color: var(--dark); }

    .seg {
      display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; margin: 4px 0 18px;
      border: 1px solid var(--glass-border); background: var(--glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); position: relative;
    }
    .seg button {
      position: relative; z-index: 1; border: 0; background: transparent; padding: 11px 10px; border-radius: 999px;
      font-size: 14px; color: var(--ink-2); font-family: inherit; cursor: pointer; transition: color .2s;
    }
    .seg button.active { color: var(--ink); font-weight: 600; }
    .seg .thumb {
      position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px;
      background: var(--glass-strong); box-shadow: 0 8px 20px -10px rgba(90,60,66,.45), inset 0 0 0 1px rgba(255,255,255,.8);
      transition: transform .25s cubic-bezier(.2,.8,.2,1);
    }
    .seg.right .thumb { transform: translateX(100%); }

    /* @@ cards */
    .list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; }
    .list-head h2 { font-size: 15px; font-weight: 500; margin: 0; }
    .list-head span { font-size: 12px; color: var(--muted); }

    /* Список */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: center;
      padding: 10px 14px 10px 10px; border-radius: var(--radius-l);
      border: 1px solid var(--glass-border); background: var(--glass);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow); cursor: pointer; transition: transform .15s ease;
      animation: rise .35s ease both;
    }
    .card:active { transform: scale(.985); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .thumb-box { width: 62px; height: 78px; border-radius: 16px; overflow: hidden; position: relative; background: var(--mauve); }
    .thumb-box img, .hero-thumb img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-thumb { position: relative; }
    .thumb-box .ph, .hero-thumb .ph { position: absolute; inset: 0; z-index: 0; display: grid; place-items: center; color: rgba(255,255,255,.9); font-size: 22px; font-weight: 300; }
    .card-main { min-width: 0; }
    .card-title { font-size: 15px; font-weight: 500; line-height: 1.25; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    /* Логотипы площадок: встроенные SVG, фирменные цвета */
    .pf { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; overflow: hidden; box-shadow: 0 2px 6px -2px rgba(40,25,20,.35); }
    .pf svg { width: 100%; height: 100%; display: block; }
    .pf.instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
    .pf.instagram svg { width: 64%; height: 64%; }
    .pf.vk { background: #0077ff; }
    .pf.vk svg { width: 70%; height: 70%; }
    .pf.tiktok { background: #010101; }
    .pf.tiktok svg { width: 60%; height: 60%; }
    .pf.youtube { background: #ff0000; }
    .pf.youtube svg { width: 66%; height: 66%; }
    .card-right { text-align: right; max-width: 96px; }
    .delta { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; white-space: nowrap; }
    .delta.up { color: #b53a62; }
    .delta.flat { color: var(--ink-2); }
    .sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.25; }
    .fly {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 3px 8px; border-radius: 999px;
      background: linear-gradient(135deg, #e86f92, var(--pink-deep)); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
    }

    .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

    /* Скелетон и ошибка */
    .skeleton .card { pointer-events: none; }
    .sk { background: linear-gradient(90deg, rgba(255,255,255,.3), rgba(255,255,255,.7), rgba(255,255,255,.3)); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 10px; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .error {
      border-radius: var(--radius-xl); padding: 28px 22px; text-align: center;
      border: 1px solid var(--glass-border); background: var(--glass-strong);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow);
    }
    .error .face { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: linear-gradient(135deg, #f7c5d1, var(--mauve)); display: grid; place-items: center; font-size: 26px; }
    .error h3 { margin: 0 0 6px; font-weight: 500; font-size: 17px; }
    .error p { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .btn-dark {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
      padding: 14px 22px; border-radius: 999px; background: var(--dark); color: #fff; font-size: 15px; font-family: inherit;
      box-shadow: 0 18px 30px -16px rgba(33,29,30,.7);
    }
    .btn-dark:active { transform: scale(.97); }
    .btn-dark svg { width: 16px; height: 16px; }

    /* @@ detail */
    /* Экран деталей */
    .detail {
      position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
      transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); visibility: hidden;
    }
    .detail.open { transform: none; visibility: visible; }
    .detail-inner { max-width: 520px; margin: 0 auto; padding: 0 16px calc(var(--safe-bottom) + 110px); }
    .cover { position: relative; height: 320px; margin: 0 -16px; overflow: hidden; border-radius: 0 0 34px 34px; background: var(--mauve); }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,14,16,.15) 0%, rgba(20,14,16,0) 35%, rgba(20,14,16,.78) 100%); }
    .cover .nav { position: absolute; top: calc(var(--safe-top) + 14px); left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 2; }
    .cover .caption { position: absolute; left: 20px; right: 20px; bottom: 20px; z-index: 2; color: #fff; }
    .cover .caption .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12px; margin-bottom: 10px; }
    .cover .caption h1 { font-size: 24px; font-weight: 400; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.3px; }
    .cover .caption .date { font-size: 12px; color: rgba(255,255,255,.72); letter-spacing: .3px; }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .tile {
      position: relative; overflow: hidden; border-radius: var(--radius-l); padding: 16px 16px 14px; min-height: 104px;
      color: var(--ink); display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .tile.wide { grid-column: 1 / -1; min-height: 120px; }
    .tile .k { font-size: 12px; color: var(--muted); letter-spacing: .2px; }
    .tile .v { font-size: 26px; font-weight: 300; letter-spacing: -0.8px; line-height: 1; white-space: nowrap; }
    .tile .v small { display: block; font-size: 12px; font-weight: 400; margin-top: 7px; color: var(--ink-2); letter-spacing: 0; }
    .tile.wide .v { font-size: 40px; }
    /* Все плитки одного спокойного цвета: светлое матовое стекло, как карточки списка */
    .tile {
      background: var(--glass-strong); border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .tile .glow { position: absolute; border-radius: 50%; filter: blur(24px); opacity: .5; width: 120px; height: 120px; right: -40px; top: -56px; background: #eea4ba; }
    .tile.wide .glow { width: 180px; height: 180px; right: -50px; top: -80px; opacity: .6; }
    .tile.t-day .v, .tile.t-week .v { color: #b53a62; }

    .chart-card {
      margin-top: 12px; padding: 18px 16px 12px; border-radius: var(--radius-xl);
      border: 1px solid var(--glass-border); background: var(--glass-strong);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow);
    }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .chart-head h3 { margin: 0; font-size: 15px; font-weight: 500; }
    .chart-head span { font-size: 12px; color: var(--muted); }
    .chart-card svg { width: 100%; height: auto; display: block; }

    .cta {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 12px 16px calc(var(--safe-bottom) + 14px);
      background: linear-gradient(180deg, rgba(185,167,153,0) 0%, rgba(185,167,153,.92) 40%);
      display: none;
    }
    .detail.open ~ .cta { display: block; }
    .cta .btn-dark { width: 100%; max-width: 520px; margin: 0 auto; display: flex; padding: 16px 22px; }
    .cta .hint { text-align: center; font-size: 11px; color: var(--muted); margin: 8px 0 0; }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="orb"></div>

  <!-- @@ layout -->
  <main class="app" id="app">
    <header class="top">
      <div>
        <h1 class="title">Что <b>летит</b><br>сегодня</h1>
        <p class="subtitle" id="updated">Загружаю данные…</p>
      </div>
      <button class="icon-btn" id="refresh" aria-label="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <section id="hero"></section>

    <div class="chips" id="chips"></div>

    <div class="seg" id="seg">
      <div class="thumb"></div>
      <button data-sort="growth" class="active">По росту за сутки</button>
      <button data-sort="views">По популярности</button>
    </div>

    <div class="list-head">
      <h2 id="listTitle">Все площадки</h2>
      <span id="listCount"></span>
    </div>

    <section class="list skeleton" id="list"></section>
  </main>

  <section class="detail" id="detail" aria-hidden="true"></section>
  <div class="cta" id="cta"></div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor('#cfc1b5');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#cfc1b5');
        } catch (e) { /* не в Telegram */ }
      }

      // @@ state
      var state = { data: null, platform: 'all', sort: 'growth', current: null };
      var PLATFORM_FALLBACK = [
        { id: 'instagram', name: 'Instagram', short: 'IG' },
        { id: 'vk', name: 'VK', short: 'VK' },
        { id: 'tiktok', name: 'TikTok', short: 'TT' },
        { id: 'youtube', name: 'YouTube', short: 'YT' }
      ];

      var $ = function (id) { return document.getElementById(id); };

      function haptic(kind) {
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {}
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // @@ format
      function fmt(n) {
        if (n == null || isNaN(n)) return '—';
        var abs = Math.abs(n);
        if (abs >= 1e6) return trim(n / 1e6) + ' млн';
        if (abs >= 1e4) return trim(n / 1e3) + ' тыс.';
        if (abs >= 1e3) return trim(n / 1e3, 1) + ' тыс.';
        return String(Math.round(n));
      }
      function trim(x, d) {
        var s = x.toFixed(d == null ? 1 : d);
        s = s.replace(/\.0$/, '');
        return s.replace('.', ',');
      }
      function fmtFull(n) {
        if (n == null || isNaN(n)) return '—';
        return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      }
      var MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      function fmtDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return iso;
        return d.getDate() + ' ' + MONTHS[d.getMonth()];
      }
      function fmtTime(iso) {
        var d = new Date(iso);
        if (isNaN(d)) return '';
        var hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
        return fmtDate(iso) + ', ' + hh + ':' + mm;
      }

      // @@ enrich
      // Прирост считаем из истории: разница между последними точками
      function enrich(item) {
        var h = Array.isArray(item.viewsHistory) ? item.viewsHistory.slice() : [];
        h.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
        var n = h.length;
        var last = n ? h[n - 1].views : (item.stats && item.stats.views) || 0;
        var prev = n > 1 ? h[n - 2].views : null;
        var week = n ? h[0].views : null;
        var dayDelta = prev == null ? 0 : last - prev;
        var dayPct = prev == null || prev === 0 ? null : (last - prev) / prev * 100;
        var weekDelta = week == null ? 0 : last - week;
        var weekPct = week == null || week === 0 ? null : (last - week) / week * 100;
        var views = (item.stats && item.stats.views) || last;
        // @@ fly-threshold
        var flying = dayDelta >= 5000 && (dayPct == null || dayPct >= 60);
        return Object.assign({}, item, {
          history: h, views: views, dayDelta: dayDelta, dayPct: dayPct, weekDelta: weekDelta, weekPct: weekPct, flying: flying
        });
      }

      function platforms() {
        return (state.data && state.data.platforms) || PLATFORM_FALLBACK;
      }
      function platformName(id) {
        var p = platforms().filter(function (x) { return x.id === id; })[0];
        return p ? p.name : id;
      }
      function platformShort(id) {
        var p = platforms().filter(function (x) { return x.id === id; })[0];
        return p ? (p.short || p.name.slice(0, 2).toUpperCase()) : '•';
      }
      // @@ logos
      // Белые глифы логотипов на фирменной подложке
      var LOGOS = {
        instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.6" cy="6.4" r="1.15" fill="#fff" stroke="none"/></svg>',
        vk: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M13.1 20C5.3 20 .9 14.7.7 5.8h3.9c.1 6.5 3 9.3 5.3 9.9V5.8h3.7v5.6c2.2-.2 4.6-2.8 5.4-5.6h3.7c-.6 3.5-3.2 6.1-5 7.2 1.8.9 4.8 3.2 5.9 7h-4.1c-.9-2.9-3.2-5.1-5.9-5.4V20h-.5z"/></svg>',
        tiktok: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
        youtube: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9.5 16.5v-9l7 4.5-7 4.5z"/></svg>'
      };
      function pfIcon(id, cls) {
        var svg = LOGOS[id] || ('<span style="font-size:9px;font-weight:700;color:#fff">' + esc(platformShort(id)) + '</span>');
        return '<span class="pf ' + esc(id) + ' ' + (cls || '') + '" title="' + esc(platformName(id)) + '">' + svg + '</span>';
      }

      function items() {
        if (!state.data) return [];
        var list = (state.data.items || []).map(enrich);
        if (state.platform !== 'all') list = list.filter(function (i) { return i.platform === state.platform; });
        list.sort(function (a, b) {
          if (state.sort === 'views') return b.views - a.views || b.dayDelta - a.dayDelta;
          return b.dayDelta - a.dayDelta || b.views - a.views;
        });
        return list;
      }

      function thumbHtml(item, cls) {
        var ph = '<div class="ph">' + esc(platformShort(item.platform)) + '</div>';
        if (!item.thumbnail) return '<div class="' + cls + '">' + ph + '</div>';
        return '<div class="' + cls + '">' + ph + '<img src="' + esc(item.thumbnail) + '" alt="" loading="lazy" onerror="this.remove()"></div>';
      }

      function pctLabel(p) {
        if (p == null) return 'новый';
        if (p >= 1000) return '×' + Math.round(p / 100 + 1);
        return (p >= 0 ? '+' : '') + Math.round(p) + '%';
      }

      // @@ render-list
      // ---------- Рендер ----------
      function renderChips() {
        var all = [{ id: 'all', name: 'Все' }].concat(platforms());
        $('chips').innerHTML = all.map(function (p) {
          return '<button class="chip' + (state.platform === p.id ? ' active' : '') + '" data-id="' + esc(p.id) + '">' +
            (p.id === 'all' ? '' : pfIcon(p.id)) + esc(p.name) + '</button>';
        }).join('');
      }

      function renderHero() {
        var box = $('hero');
        if (!state.data) { box.innerHTML = ''; return; }
        var top = (state.data.items || []).map(enrich).sort(function (a, b) { return b.dayDelta - a.dayDelta; })[0];
        if (!top || top.dayDelta <= 0) { box.innerHTML = ''; return; }
        box.innerHTML =
          '<article class="hero" data-id="' + esc(top.id) + '">' +
            '<div class="hero-label"><span class="dot"></span>Летит сейчас</div>' +
            '<div class="hero-body">' + thumbHtml(top, 'hero-thumb') +
              '<div><p class="hero-title">' + esc(top.title) + '</p>' +
              '<div class="hero-meta">' + esc(platformName(top.platform)) + ' · ' + fmtDate(top.publishedAt) + '</div></div>' +
            '</div>' +
            '<div class="hero-num"><strong>+' + fmt(top.dayDelta) + '</strong>' +
              '<span class="hero-pct">' + pctLabel(top.dayPct) + '</span>' +
              '<span class="hero-sub">за сутки · всего ' + fmt(top.views) + ' просмотров</span></div>' +
          '</article>';
      }

      function renderList() {
        var list = items();
        var box = $('list');
        box.classList.remove('skeleton');
        $('listTitle').textContent = state.platform === 'all' ? 'Все площадки' : platformName(state.platform);
        $('listCount').textContent = list.length ? list.length + ' ' + plural(list.length, ['публикация', 'публикации', 'публикаций']) : '';
        if (!list.length) { box.innerHTML = '<div class="empty">Здесь пока пусто</div>'; return; }
        box.innerHTML = list.map(function (it, idx) {
          var main, sub;
          if (state.sort === 'views') {
            main = '<div class="delta flat">' + fmt(it.views) + '</div>';
            sub = '<div class="sub">' + (it.dayDelta > 0 ? '+' + fmt(it.dayDelta) + ' за сутки' : 'без роста') + '</div>';
          } else {
            main = '<div class="delta ' + (it.dayDelta > 0 ? 'up' : 'flat') + '">' + (it.dayDelta > 0 ? '+' : '') + fmt(it.dayDelta) + '</div>';
            sub = '<div class="sub">всего ' + fmt(it.views) + '</div>';
          }
          return '<article class="card" data-id="' + esc(it.id) + '" style="animation-delay:' + Math.min(idx * 35, 300) + 'ms">' +
            thumbHtml(it, 'thumb-box') +
            '<div class="card-main"><p class="card-title">' + esc(it.title) + '</p>' +
              '<div class="card-meta">' + pfIcon(it.platform) + '<span>' + esc(platformName(it.platform)) + '</span><span>·</span><span>' + fmtDate(it.publishedAt) + '</span></div></div>' +
            '<div class="card-right">' + main + sub + (it.flying ? '<span class="fly">✦ Летит</span>' : '') + '</div>' +
          '</article>';
        }).join('');
      }

      function plural(n, forms) {
        var a = Math.abs(n) % 100, b = a % 10;
        if (a > 10 && a < 20) return forms[2];
        if (b > 1 && b < 5) return forms[1];
        if (b === 1) return forms[0];
        return forms[2];
      }

      function renderSkeleton() {
        var box = $('list');
        box.classList.add('skeleton');
        var row = '<div class="card"><div class="thumb-box sk"></div><div><div class="sk" style="height:14px;width:80%;margin-bottom:8px"></div><div class="sk" style="height:11px;width:50%"></div></div><div class="sk" style="height:18px;width:54px"></div></div>';
        box.innerHTML = row + row + row + row;
      }

      function renderError(msg) {
        $('hero').innerHTML = '';
        $('listCount').textContent = '';
        var box = $('list');
        box.classList.remove('skeleton');
        box.innerHTML =
          '<div class="error"><div class="face">☁️</div><h3>Не удалось загрузить данные</h3>' +
          '<p>' + esc(msg || 'Проверь, что файл data.json лежит рядом с приложением и открывается.') + '</p>' +
          '<button class="btn-dark" id="retry">Повторить</button></div>';
        $('retry').addEventListener('click', function () { haptic(); load(); });
      }

      // @@ render-detail
      // ---------- Детали ----------
      // @@ chart
      function chartSvg(h) {
        var W = 320, H = 150, padL = 8, padR = 8, padT = 16, padB = 26;
        if (!h || h.length < 2) return '<div class="empty" style="padding:20px">Истории просмотров пока нет</div>';
        var vals = h.map(function (p) { return p.views; });
        var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
        if (max === min) max = min + 1;
        var n = h.length;
        var pts = h.map(function (p, i) {
          var x = padL + (W - padL - padR) * i / (n - 1);
          var y = padT + (H - padT - padB) * (1 - (p.views - min) / (max - min));
          return [x, y];
        });
        var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
        var area = line + ' L' + pts[n - 1][0].toFixed(1) + ' ' + (H - padB) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - padB) + ' Z';
        var labels = h.map(function (p, i) {
          var d = new Date(p.date);
          var t = isNaN(d) ? '' : String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
          var anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
          return '<text x="' + pts[i][0].toFixed(1) + '" y="' + (H - 6) + '" font-size="10" fill="#7d6d62" text-anchor="' + anchor + '">' + t + '</text>';
        }).join('');
        var last = pts[n - 1];
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="Просмотры по дням">' +
          '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9466e" stop-opacity=".5"/><stop offset="1" stop-color="#c9466e" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + area + '" fill="url(#ga)"/>' +
          '<path d="' + line + '" fill="none" stroke="#2b231e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
          pts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#fff" stroke="#2b231e" stroke-width="1.4"/>'; }).join('') +
          '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="6" fill="#c9466e" opacity=".35"/>' +
          '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.2" fill="#c9466e"/>' +
          labels + '</svg>';
      }

      function tile(cls, k, v, small, wide) {
        return '<div class="tile ' + cls + (wide ? ' wide' : '') + '"><span class="glow"></span><div class="k">' + k + '</div>' +
          '<div class="v">' + v + (small ? '<small>' + small + '</small>' : '') + '</div></div>';
      }

      function openDetail(id) {
        var it = (state.data.items || []).map(enrich).filter(function (x) { return x.id === id; })[0];
        if (!it) return;
        state.current = it;
        haptic('medium');
        var s = it.stats || {};
        // @@ detail-tiles
        var tiles =
          tile('t-views', 'Просмотры всего', fmtFull(it.views), '', true) +
          tile('t-day', 'За сутки', (it.dayDelta >= 0 ? '+' : '') + fmt(it.dayDelta), pctLabel(it.dayPct)) +
          tile('t-week', 'За неделю', (it.weekDelta >= 0 ? '+' : '') + fmt(it.weekDelta), pctLabel(it.weekPct)) +
          tile('t-likes', 'Лайки', fmt(s.likes)) +
          tile('t-comments', 'Комментарии', fmt(s.comments)) +
          tile('t-shares', 'Репосты', fmt(s.shares)) +
          (s.saves != null ? tile('t-saves', 'Сохранения', fmt(s.saves)) : tile('t-saves', 'Сохранения', '—', 'нет на площадке'));

        $('detail').innerHTML =
          '<div class="detail-inner">' +
            '<div class="cover">' + (it.thumbnail ? '<img src="' + esc(it.thumbnail) + '" alt="" onerror="this.remove()">' : '') +
              '<div class="nav"><button class="icon-btn" id="back" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
              (it.flying ? '<span class="fly" style="margin:0;align-self:center;padding:8px 12px;font-size:12px">✦ Летит</span>' : '') + '</div>' +
              '<div class="caption"><span class="pill">' + pfIcon(it.platform) + esc(platformName(it.platform)) + '</span>' +
              '<h1>' + esc(it.title) + '</h1><div class="date">Опубликовано ' + fmtDate(it.publishedAt) + '</div></div>' +
            '</div>' +
            '<div class="tiles">' + tiles + '</div>' +
            '<div class="chart-card"><div class="chart-head"><h3>Просмотры по дням</h3><span>последние ' + it.history.length + ' дн.</span></div>' + chartSvg(it.history) + '</div>' +
          '</div>';

        $('cta').innerHTML =
          '<button class="btn-dark" id="openPost">Открыть пост <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></button>' +
          '<p class="hint">' + esc(platformName(it.platform)) + ' откроется снаружи</p>';

        $('detail').classList.add('open');
        $('detail').setAttribute('aria-hidden', 'false');
        $('detail').scrollTop = 0;
        document.body.style.overflow = 'hidden';

        $('back').addEventListener('click', closeDetail);
        $('openPost').addEventListener('click', function () {
          haptic();
          if (!it.url) return;
          try {
            if (tg && tg.openLink) tg.openLink(it.url); else window.open(it.url, '_blank', 'noopener');
          } catch (e) { window.open(it.url, '_blank', 'noopener'); }
        });
        try { if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeDetail); } } catch (e) {}
      }

      function closeDetail() {
        haptic();
        $('detail').classList.remove('open');
        $('detail').setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        state.current = null;
        try { if (tg && tg.BackButton) { tg.BackButton.offClick(closeDetail); tg.BackButton.hide(); } } catch (e) {}
      }

      // @@ events
      // ---------- События ----------
      $('chips').addEventListener('click', function (e) {
        var b = e.target.closest('.chip'); if (!b) return;
        haptic();
        state.platform = b.getAttribute('data-id');
        renderChips(); renderList();
      });
      $('seg').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        haptic();
        state.sort = b.getAttribute('data-sort');
        $('seg').classList.toggle('right', state.sort === 'views');
        Array.prototype.forEach.call($('seg').querySelectorAll('button'), function (x) { x.classList.toggle('active', x === b); });
        renderList();
      });
      document.addEventListener('click', function (e) {
        var c = e.target.closest('.card[data-id], .hero[data-id]');
        if (c && state.data) openDetail(c.getAttribute('data-id'));
      });
      $('refresh').addEventListener('click', function () { haptic(); load(); });

      // @@ load
      // ---------- Загрузка ----------
      function load() {
        renderSkeleton();
        $('updated').textContent = 'Загружаю данные…';
        fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (json) {
            if (!json || !Array.isArray(json.items)) throw new Error('В data.json нет списка items');
            state.data = json;
            $('updated').textContent = json.updatedAt ? 'Обновлено ' + fmtTime(json.updatedAt) : 'Данные загружены';
            renderChips(); renderHero(); renderList();
          })
          .catch(function (err) {
            state.data = null;
            $('updated').textContent = 'Данные недоступны';
            renderChips();
            renderError(err && err.message ? 'Причина: ' + err.message : '');
          });
      }

      renderChips();
      load();
    })();
  </script>
</body>
</html>
